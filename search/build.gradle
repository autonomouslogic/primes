plugins {
	id "java"
	id "idea"
	id "application"
	id "io.freefair.lombok" version "9.5.0"
	id "com.diffplug.spotless" version "8.10.2"
	id "org.danilopianini.git-sensitive-semantic-versioning-gradle-plugin" version "7.0.24"
}

group = "com.autonomouslogic.primes.search"

repositories {
	mavenCentral()
}

dependencies {
	implementation project(":")
	implementation "com.autonomouslogic.commons:commons-java:1.11.3"
	implementation "org.apache.logging.log4j:log4j-api:2.26.1"
	implementation "org.apache.logging.log4j:log4j-core:2.26.1"
	implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"
	implementation "com.google.guava:guava:33.7.1-jre"
	implementation "commons-io:commons-io:2.22.0"
	implementation "org.apache.commons:commons-compress:1.28.0"
	implementation "org.tukaani:xz:1.12"
	implementation "com.fasterxml.jackson.core:jackson-annotations:2.22"
	implementation "com.fasterxml.jackson.core:jackson-core:2.22.2"
	implementation "com.fasterxml.jackson.core:jackson-databind:2.22.2"
	implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2"
	implementation "software.amazon.awssdk:s3:2.54.17"

	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
	mainClass = "com.autonomouslogic.primes.search.PrimeSearch"
}

run {
	environment rootProject.ext.envProperties
}

test {
	useJUnitPlatform()
}

spotless {
	java {
		palantirJavaFormat()
		leadingSpacesToTabs()
	}

	groovyGradle {
		leadingSpacesToTabs()
	}
}
